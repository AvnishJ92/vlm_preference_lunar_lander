# Every hyperparameter of the experiment. "Paper" = Christiano et al. 2017, arXiv:1706.03741; section in brackets.
# Values marked (paper) are taken from it; the rest are choices for LunarLander that no training run has tuned yet.

total_timesteps: 2000000
n_envs: 16
hide_episode_ends: true   # (paper) [A] the agent gets no termination signal; false = the standard episodic task
threads: 2            # torch CPU threads per run; policy and reward predictor are small MLPs and run on CPU

ppo:                  # the paper used TRPO for its control tasks [A.1]; PPO is its successor and has the entropy bonus
  n_steps: 1024       # per env, so one policy update every 16 x 1024 = 16384 timesteps
  batch_size: 64
  n_epochs: 4
  learning_rate: 3.0e-4
  gamma: 0.995        # (paper) [A.1]
  gae_lambda: 0.97    # (paper) [A.1]
  ent_coef: 0.01      # (paper) [A.1] entropy bonus, kept for all four conditions
  policy_kwargs:
    net_arch: [64, 64]   # two hidden layers of 64 tanh units, for the actor and, separately, for the critic.
                         # With one layer true-reward PPO stalled at 117-166; with two it reaches about 270.

eval:                 # deterministic policy, true reward, standard episodic LunarLander-v3, same seeds for every run
  every: 50000        # timesteps
  episodes: 20
  video_episodes: 1   # episodes per evaluation saved as mp4
  final_episodes: 100
  final_video_episodes: 5

pref:
  n_queries: 1400         # (paper) [3.1.1] used 350 / 700 / 1400 synthetic and 700 human labels per task
  segment_len: 75         # (paper) [A.1] 1.5 s clips; LunarLander runs at 50 steps per second
  pretrain_frac: 0.25     # (paper) [A.1] share of the comparisons made on the untrained policy before RL starts
  pretrain_steps: 16000   # timesteps of the untrained policy those first comparisons are drawn from
  anneal_tau_frac: 0.1    # label rate ~ tau/(T+tau) [A.1, A.2]; tau = this x total_timesteps (paper Atari: 5e6 of 50e6)
  candidate_factor: 10    # (paper) [A] candidate pairs per query; the highest ensemble variance ones are asked
  ensemble: 3             # (paper) [A]
  hidden: 64              # (paper) [A.1] two hidden layers of 64, leaky ReLU 0.01
  label_noise: 0.1        # (paper) [2.2.3] assumed chance that the rater answers uniformly at random
  val_ratio: [1.1, 1.5]   # (paper) [2.2.3] l2 is adapted to keep validation loss within this multiple of train loss
  l2_init: 1.0e-4
  lr: 1.0e-3
  batch_size: 64          # preference pairs per gradient step
  pretrain_epochs: 100    # passes over the first comparisons before RL starts
  round_every: 16384      # timesteps between feedback rounds (new queries + predictor training): one per PPO update
  epochs_per_round: 10    # passes over all comparisons in every feedback round

vlm:
  model: Qwen/Qwen2.5-VL-7B-Instruct
  revision: cc594898137f460bfe9f0759e9844b3ce807cfb5
  prompt: direct          # a variant in prompts.yaml
  input_mode: video       # video: each clip as one Qwen video | images: each frame as a separate image
  frames_per_clip: 8      # must be even for video (Qwen merges frames in pairs)
  frame_scale: 1.0        # upscale the 600x400 frames before the model sees them (more vision tokens)
  mark_out_of_view: false # write LANDER OUT OF VIEW on frames where the lander has left the picture
  batch_size: 8           # conversations per generate() call; 16 and 32 were no faster per query (measured)
  max_new_tokens: 12      # enough for `ANSWER: UNSURE`
  swap_check: true        # ask every pair in both orders; contradictory answers give no label
  save_clip_every: 10     # save an mp4 + the frames shown for every Nth VLM query

# What supplies the reward. No oracle_fraction: PPO on the true reward. Otherwise each query is answered by the
# true-reward oracle with this probability and by the VLM the rest of the time.
conditions:
  pure_rl: {}
  oracle: {oracle_fraction: 1.0}
  vlm: {oracle_fraction: 0.0}
  mixed: {oracle_fraction: 0.5}   # NOT from the paper, which never mixes raters. Set the ratio you want here.

seeds: [0, 1, 2, 3, 4]

# Prompt tuning (python -m prefrl.calibrate): each variant overrides keys of `vlm` and is scored against the oracle.
# The clips are what a training run produces: a true-reward PPO run from scratch (crashing, then hovering, then
# landing), with both clips of a pair taken from the same PPO update, plus pairs against a lander that flies away.
calibration:
  train_steps: 802816     # 49 PPO updates of the true-reward run; the two-layer policy passes 200 at about 0.5M
  away_steps: 1500        # steps per env of "main engine only" before it, which carries the lander out of the picture
  n_pairs: 294            # 6 pairs per PPO update, tagged early / mid / late by thirds of the run
  n_away_pairs: 40        # an out-of-view clip against a clip from the PPO run
  variants:
    direct: {}
    direct_marked: {mark_out_of_view: true}
    progress_marked: {prompt: progress, mark_out_of_view: true}
    reasoned_marked: {prompt: reasoned, max_new_tokens: 320, mark_out_of_view: true}
